    <!-- No external font CDNs at boot. System fonts are used as a fast fallback.
         Web fonts (Google/Yandex) are loaded lazily from main.tsx after first paint
         so the page never blocks on fonts.googleapis.com (which can hang in
         Yandex Browser without a VPN). -->
    <style>
      html, body { background: #ffffff; color: #171a22; margin: 0; }
      .__boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center; padding: 24px; z-index: 1;
        opacity: 1; transition: opacity 0.15s ease-out;
      }
      .__boot.__fading { opacity: 0; }
      .__boot h1 {
        font-size: 28px; font-weight: 700; letter-spacing: 0.02em;
        color: #171a22; margin: 0;
      }
      .__boot p { color: #737986; font-size: 13px; margin: 0; max-width: 360px; }
      .__boot .__sp {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid #eceef1; border-top-color: #d4be37;
        animation: __spin 0.9s linear infinite;
      }
      .__boot .__retry {
        display: none; margin-top: 8px; padding: 10px 18px;
        border: 1px solid #d4be37; background: transparent;
        color: #171a22; border-radius: 6px; cursor: pointer; font-size: 14px;
      }
      @keyframes __spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <!-- Yandex.Metrika is initialised lazily from src/lib/lazy-third-party.ts
         after first paint. The noscript pixel was removed because it pings
         mc.yandex.ru even before JS runs and can hang Yandex Browser without VPN. -->
    <div id="root">
      <div class="__boot" id="__boot">
        <h1>24ZXC</h1>
        <div class="__sp" aria-hidden="true"></div>
        <p id="__boot-text">Загружаем сайт…</p>
        <button class="__retry" id="__boot-retry" onclick="location.reload()">Обновить страницу</button>
      </div>
    </div>
    <script>
      // If the React bundle hasn't booted in 8 seconds, surface a retry button
      // so the user is never stuck on a blank screen (Yandex Browser without VPN).
      (function () {
        var t = setTimeout(function () {
          var b = document.getElementById('__boot-text');
          var r = document.getElementById('__boot-retry');
          if (b) b.textContent = 'Загрузка занимает дольше обычного. Попробуйте обновить страницу.';
          if (r) r.style.display = 'inline-block';
        }, 8000);
        window.addEventListener('error', function (e) {
          // Chunk / script load errors -> show retry button immediately
          if (e && (e.message || '').toString().toLowerCase().indexOf('chunk') !== -1) {
            var r = document.getElementById('__boot-retry');
            if (r) r.style.display = 'inline-block';
          }
        });
        window.__clearBoot = function () {
          clearTimeout(t);
          var el = document.getElementById('__boot');
          if (el && el.parentNode) {
            el.classList.add('__fading');
            setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 180);
          }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
