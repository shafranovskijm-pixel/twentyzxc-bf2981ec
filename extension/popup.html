<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>НМО Автозаполнение</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 320px; margin: 0; padding: 16px; background: #15171e; color: #e7e7e7; }
  h1 { margin: 0 0 8px 0; font-size: 16px; color: #d4be37; }
  .org { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
  .meta { font-size: 11px; color: #888; margin-bottom: 12px; }
  button { width: 100%; padding: 10px; background: #d4be37; color: #15171e; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:hover { background: #e8d24a; }
  button.secondary { background: transparent; color: #d4be37; border: 1px solid #d4be37; margin-top: 8px; }
  .empty { color: #888; text-align: center; padding: 20px 0; font-size: 12px; }
  .status { margin-top: 12px; padding: 8px; background: #1f2229; border-radius: 4px; font-size: 11px; color: #aaa; min-height: 16px; }
  .url-hint { font-size: 10px; color: #666; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>
<h1>НМО Автозаполнение</h1>
<div id="content"></div>
<div class="status" id="status">Готов к работе</div>
<script src="popup.js"></script>
</body>
</html>
